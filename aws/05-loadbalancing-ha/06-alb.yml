AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Module 05 - High Availability: Khởi tạo Application Load Balancer (ALB),
  Target Group và Listener với kiểm tra sức khỏe (Health Check) tự động.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: Tên môi trường

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID của VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 1 (AZ a)

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: Public Subnet 2 (AZ c - Bắt buộc tối thiểu 2 AZs cho ALB)

  ALBSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group cho ALB (mở port 80/443)

Resources:
  # =========================================================================
  # 1. APPLICATION LOAD BALANCER
  # =========================================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-alb"
      Type: application
      Scheme: internet-facing # Nhan traffic truc tiep tu Internet
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-alb"

  # =========================================================================
  # 2. TARGET GROUP (Nhom dich tiep nhan traffic tu ALB)
  # =========================================================================
  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-web-tg"
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      # Cau hinh kiem tra trang thai server (Health Check)
      HealthCheckProtocol: HTTP
      HealthCheckPort: '80'
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30' # Rut ngan thoi gian cho khi go may chu loi
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-web-tg"

  # =========================================================================
  # 3. LISTENER (Lang nghe o port 80 va chuyen tiep toi Target Group)
  # =========================================================================
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

Outputs:
  ALBDNSName:
    Description: Dia chi DNS truy cap cua Load Balancer
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${EnvironmentName}-ALBDNSName"

  TargetGroupArn:
    Description: ARN cua Target Group de gan vao Auto Scaling Group
    Value: !Ref ALBTargetGroup
    Export:
      Name: !Sub "${EnvironmentName}-TargetGroupArn"
